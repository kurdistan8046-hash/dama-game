<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ئەپی کوردستان - دامە</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6; --board-dark: #8b4513; --board-light: #deb887;
            --player1-color: #111111; --player2-color: #f8f9fa;
            --highlight: rgba(34, 197, 94, 0.7); --danger: rgba(239, 68, 68, 0.5);
        }
        body {
            font-family: 'Tahoma', sans-serif; background-color: var(--bg-color);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation;
        }
        .header { text-align: center; margin-bottom: 5px; }
        .flag { width: 70px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .controls {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%;
            max-width: 450px; margin-bottom: 10px; box-sizing: border-box;
        }
        .control-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        select, input[type="color"], input[type="range"], input[type="text"] {
            padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;
        }
        .online-box {
            background: #e0f2fe; padding: 10px; border-radius: 8px; border: 1px solid #bae6fd;
            display: none; flex-direction: column; gap: 10px; margin-top: 10px;
        }
        .timer-box {
            background: #9ca3af; color: white; padding: 10px 20px; border-radius: 30px;
            font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 10px; justify-content: center; transition: background 0.3s;
        }
        .alert-box { color: #ef4444; font-weight: bold; height: 24px; margin-bottom: 5px; font-size: 1.1rem; text-align: center; }
        .board {
            display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; max-width: 450px; aspect-ratio: 1/1;
            border: 4px solid #4a3728; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .cell { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .cell.dark { background-color: var(--board-dark); }
        .cell.light { background-color: var(--board-light); }
        .cell.highlight { background-color: var(--highlight); cursor: pointer; border: 3px solid #16a34a; box-sizing: border-box; }
        .cell.highlight-danger { background-color: var(--danger); cursor: pointer; border: 3px solid #b91c1c; box-sizing: border-box; }
        
        .piece {
            width: 80%; height: 80%; border-radius: 50%;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.4), 0 3px 5px rgba(0,0,0,0.5);
            transition: all 0.2s ease; cursor: pointer;
            display: flex; justify-content: center; align-items: center; border: 2px solid rgba(0,0,0,0.2);
        }
        .piece.p1 { background-color: var(--player1-color); }
        .piece.p2 { background-color: var(--player2-color); }
        .piece.selected { transform: scale(1.15); box-shadow: 0 0 15px yellow; border: 2px solid yellow; z-index: 10; }
        .piece.king::after { content: '👑'; font-size: 1.5rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        
        .status { margin: 5px 0; font-size: 1.2rem; font-weight: bold; text-align: center; }
        .btn {
            color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;
        }
        .btn-blue { background-color: #2563eb; } .btn-blue:active { background-color: #1d4ed8; }
        .btn-green { background-color: #16a34a; } .btn-orange { background-color: #d97706; }
    </style>
</head>
<body>

    <div class="header">
        <svg class="flag" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="300" height="66.6" fill="#ED2024"/>
            <rect y="66.6" width="300" height="66.6" fill="#FFFFFF"/>
            <rect y="133.2" width="300" height="66.8" fill="#278E43"/>
            <circle cx="150" cy="100" r="22" fill="#FEBD11"/>
        </svg>
        <h2 style="margin: 5px 0; color: #1f2937;">دامەی کوردستان</h2>
    </div>

    <div class="timer-box" id="timerBox">⏱️ <span id="timeDisplay">وەستاوە</span></div>

    <div class="controls">
        <div class="control-group">
            <label>شێوازی یاری:</label>
            <select id="gameMode" onchange="changeMode()">
                <option value="pvp">دوو یاریزان (لەسەر یەک شاشە)</option>
                <option value="ai">کۆمپیوتەر (AI)</option>
                <option value="online">ئۆنلاین لەگەڵ هاوڕێ 🌐</option>
            </select>
        </div>
        
        <div class="control-group" id="aiLevelContainer" style="display: none;">
            <label>ئاستی کۆمپیوتەر (بێ حەد زیرەک 100):</label>
            <input type="range" id="aiLevel" min="0" max="100" value="100">
        </div>

        <div class="online-box" id="onlineContainer">
            <div style="font-size: 0.9rem; color: #0369a1; font-weight: bold;">کۆدەکەی خۆت بدە بە هاوڕێکەت، یان هی ئەو بنووسە.</div>
            <div style="display: flex; justify-content: space-between;">
                <span>کۆدی تۆ:</span>
                <strong id="myCode" style="font-size: 1.2rem; color: #b91c1c; letter-spacing: 2px;">دروستکردن...</strong>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="friendCode" placeholder="کۆدی هاوڕێکەت..." style="width: 60%; text-align: center; font-weight: bold; font-size: 1.1rem;">
                <button class="btn btn-green" style="width: 40%; padding: 5px;" onclick="connectToFriend()">بەستنەوە</button>
            </div>
            <div id="onlineStatus" style="text-align: center; font-weight: bold; color: #047857;">چاوەڕوانی بەستنەوە...</div>
        </div>

        <div class="control-group" style="margin-top: 15px;">
            <label>بەردی ١ (خوارەوە):</label>
            <input type="color" id="color1" value="#111111" onchange="updateColors()">
            <label>بەردی ٢ (سەرەوە):</label>
            <input type="color" id="color2" value="#f8f9fa" onchange="updateColors()">
        </div>
        
        <button id="togglePlayBtn" class="btn btn-green" onclick="togglePlay()">دەستپێکردنی یاری ▶️</button>
        <button class="btn btn-blue" onclick="resetGame(true)">ڕیفرێشکردنەوەی تەختە 🔄</button>
    </div>

    <div id="alertBox" class="alert-box"></div>
    <div id="status" class="status">چاوەڕێی دەستپێکردن...</div>

    <div class="board" id="board"></div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'move') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'capture') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });

        const ROWS = 8, COLS = 8;
        let board = [];
        let currentPlayer = 1; 
        let selectedPiece = null;
        let validMoves = [];
        let isMultiCapturing = false; 
        let isPlaying = false; 
        const EMPTY = 0, P1 = 1, P2 = 2, P1_KING = 3, P2_KING = 4;

        let timerInterval;
        let timeLeft = 30;

        let peer = null, conn = null, myId = "", isOnline = false, amIPlayer1 = true;

        function showAlert(msg) {
            const box = document.getElementById('alertBox'); box.innerText = msg;
            setTimeout(() => box.innerText = "", 3500);
        }

        function updateColors() {
            document.documentElement.style.setProperty('--player1-color', document.getElementById('color1').value);
            document.documentElement.style.setProperty('--player2-color', document.getElementById('color2').value);
            if(isPlaying) updateStatus();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('togglePlayBtn');
            if (isPlaying) {
                btn.innerText = "وەستاندنی یاری ⏸️"; btn.className = "btn btn-orange";
                updateStatus(); startTimer();
                const mode = document.getElementById('gameMode').value;
                if (mode === 'ai' && currentPlayer === 2) setTimeout(makeAIMove, 600);
            } else {
                btn.innerText = "دەستپێکردنەوە ▶️"; btn.className = "btn btn-green";
                clearInterval(timerInterval);
                document.getElementById('timerBox').style.background = "#9ca3af";
                document.getElementById('status').innerText = "یاری وەستاوە...";
            }
        }

        function changeMode() {
            const mode = document.getElementById('gameMode').value;
            document.getElementById('aiLevelContainer').style.display = (mode === 'ai') ? 'flex' : 'none';
            document.getElementById('onlineContainer').style.display = (mode === 'online') ? 'flex' : 'none';
            if (mode === 'online' && !peer) setupOnline();
            else if (mode !== 'online') { isOnline = false; if(conn) conn.close(); }
            resetGame(true);
        }

        function setupOnline() {
            myId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(myId);
            peer.on('open', function(id) { document.getElementById('myCode').innerText = id; });
            peer.on('connection', function(connection) {
                conn = connection; setupConnection(); amIPlayer1 = true;
                document.getElementById('onlineStatus').innerText = "✅ هاوڕێکەت هاتە ژوورەوە!"; resetGame(false);
            });
        }
        function connectToFriend() {
            const friendId = document.getElementById('friendCode').value.trim();
            if(!friendId || friendId === myId) return alert("کۆدێکی ڕاست بنووسە!");
            document.getElementById('onlineStatus').innerText = "بەستنەوە...";
            conn = peer.connect(friendId);
            conn.on('open', function() {
                setupConnection(); amIPlayer1 = false;
                document.getElementById('onlineStatus').innerText = "✅ بەستراینەوە! یاری دەستی پێکرد."; resetGame(false);
            });
        }
        function setupConnection() {
            isOnline = true;
            conn.on('data', function(data) {
                if(data.type === 'move') {
                    if(!isPlaying) { isPlaying = true; document.getElementById('togglePlayBtn').innerText = "وەستاندنی یاری ⏸️"; document.getElementById('togglePlayBtn').className = "btn btn-orange"; }
                    selectedPiece = { r: data.selectedR, c: data.selectedC, val: board[data.selectedR][data.selectedC] };
                    calculateValidMoves();
                    executeMove(data.r, data.c, data.selectedR, data.selectedC, false);
                } else if(data.type === 'reset') { resetGame(false); }
            });
        }

        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(EMPTY));
            for (let c = 0; c < COLS; c++) { board[1][c] = P2; board[2][c] = P2; }
            for (let c = 0; c < COLS; c++) { board[5][c] = P1; board[6][c] = P1; }
        }

        function drawBoard() {
            const boardDiv = document.getElementById('board'); boardDiv.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    let moveOpt = validMoves.find(m => m.r === r && m.c === c);
                    if (moveOpt) {
                        cell.classList.add(moveOpt.capture ? 'highlight-danger' : 'highlight');
                        cell.onclick = () => onCellClick(r, c, true);
                    } else {
                        cell.onclick = () => onCellClick(r, c, false);
                    }

                    const val = board[r][c];
                    if (val !== EMPTY) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${val === P1 || val === P1_KING ? 'p1' : 'p2'}`;
                        if (val === P1_KING || val === P2_KING) piece.classList.add('king');
                        if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) piece.classList.add('selected');
                        cell.appendChild(piece);
                    }
                    boardDiv.appendChild(cell);
                }
            }
        }

        function isValid(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
        function isEnemy(enemyVal, myVal) {
            let myPlayer = (myVal === P1 || myVal === P1_KING) ? 1 : 2;
            if (myPlayer === 1) return enemyVal === P2 || enemyVal === P2_KING;
            return enemyVal === P1 || enemyVal === P1_KING;
        }

        // =========================================================
        // لۆژیکی یاری و گەڕان بەدوای خواردن (تەواو بێ هەڵەیە)
        // =========================================================
        function getCaptureMovesForPiece(r, c, bState) {
            let caps = [];
            const val = bState[r][c];
            const isKing = (val === P1_KING || val === P2_KING);
            
            if (isKing) {
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1], foundEnemy = false, enemyPos = null;
                    while (isValid(nr, nc)) {
                        let cellVal = bState[nr][nc];
                        if (cellVal !== EMPTY) {
                            if (!foundEnemy && isEnemy(cellVal, val)) { foundEnemy = true; enemyPos = {r: nr, c: nc}; } 
                            else { break; }
                        } else if (foundEnemy) {
                            caps.push({ r: nr, c: nc, capture: enemyPos });
                        }
                        nr += d[0]; nc += d[1];
                    }
                });
            } else {
                const dir = (val === P1) ? -1 : 1;
                const directions = [[dir, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1], jumpR = r + (d[0]*2), jumpC = c + (d[1]*2);
                    if (isValid(jumpR, jumpC) && bState[jumpR][jumpC] === EMPTY && isValid(nr, nc)) {
                        let enemy = bState[nr][nc];
                        if (enemy !== EMPTY && isEnemy(enemy, val)) caps.push({ r: jumpR, c: jumpC, capture: {r: nr, c: nc} });
                    }
                });
            }
            return caps;
        }

        function getNormalMovesForPiece(r, c, bState) {
            let moves = [];
            const val = bState[r][c];
            const isKing = (val === P1_KING || val === P2_KING);
            if (isKing) {
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1];
                    while (isValid(nr, nc) && bState[nr][nc] === EMPTY) { moves.push({ r: nr, c: nc, capture: null }); nr += d[0]; nc += d[1]; }
                });
            } else {
                const dir = (val === P1) ? -1 : 1;
                const directions = [[dir, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1];
                    if (isValid(nr, nc) && bState[nr][nc] === EMPTY) moves.push({ r: nr, c: nc, capture: null });
                });
            }
            return moves;
        }

        function getAllMandatoryCaptures(player, bState) {
            let caps = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = bState[r][c];
                    if ((player === 1 && (val === P1 || val === P1_KING)) || (player === 2 && (val === P2 || val === P2_KING))) {
                        let pieceCaps = getCaptureMovesForPiece(r, c, bState);
                        if (pieceCaps.length > 0) caps.push({r, c});
                    }
                }
            }
            return caps;
        }

        function onCellClick(r, c, isHighlight) {
            if (!isPlaying) return showAlert("تکایە سەرەتا کلیک لە 'دەستپێکردنی یاری' بکە!");
            const mode = document.getElementById('gameMode').value;
            if (mode === 'ai' && currentPlayer === 2) return;
            if (isOnline) { if (amIPlayer1 && currentPlayer === 2) return; if (!amIPlayer1 && currentPlayer === 1) return; }
            if (isMultiCapturing) {
                if (isHighlight) executeMove(r, c, selectedPiece.r, selectedPiece.c, true);
                else showAlert("دەبێت بەردەوام بیت لە زنجیرە خواردن!");
                return;
            }
            if (isHighlight) executeMove(r, c, selectedPiece.r, selectedPiece.c, true);
            else selectPiece(r, c);
        }

        function selectPiece(r, c) {
            const val = board[r][c];
            if (val === EMPTY) return;
            const isP1Piece = (val === P1 || val === P1_KING);
            if ((currentPlayer === 1 && !isP1Piece) || (currentPlayer === 2 && isP1Piece)) return;

            let mandatoryPieces = getAllMandatoryCaptures(currentPlayer, board);
            if (mandatoryPieces.length > 0) {
                let isMandatory = mandatoryPieces.some(p => p.r === r && p.c === c);
                if (!isMandatory) return showAlert("یاسا: دەبێت ئەو بەردە بجووڵێنیت کە خواردنی هەیە!");
            }

            selectedPiece = { r, c, val };
            calculateValidMoves(); drawBoard();
        }

        function calculateValidMoves() {
            validMoves = [];
            if (!selectedPiece) return;
            let caps = getCaptureMovesForPiece(selectedPiece.r, selectedPiece.c, board);
            if (caps.length > 0) {
                // یاسای زۆرترین خواردن: تەنها ئەو خانانە پیشان دەدات کە خواردنی تری لەدوایە ئەگەر هەبێت
                let multiCaps = caps.filter(c => {
                    let simBoard = board.map(row => [...row]);
                    simBoard[c.r][c.c] = simBoard[selectedPiece.r][selectedPiece.c];
                    simBoard[selectedPiece.r][selectedPiece.c] = EMPTY;
                    simBoard[c.capture.r][c.capture.c] = EMPTY;
                    let nextCaps = getCaptureMovesForPiece(c.r, c.c, simBoard);
                    return nextCaps.length > 0;
                });
                validMoves = (multiCaps.length > 0) ? multiCaps : caps;
            } else {
                validMoves = getNormalMovesForPiece(selectedPiece.r, selectedPiece.c, board);
            }
        }

        function declareWinner(losingPlayer) {
            isPlaying = false; clearInterval(timerInterval);
            document.getElementById('togglePlayBtn').innerText = "یاری تەواو بوو 🏁";
            document.getElementById('togglePlayBtn').className = "btn btn-blue";
            document.getElementById('timerBox').style.background = "#9ca3af";
            document.getElementById('timeDisplay').innerText = "کۆتایی";
            document.getElementById('status').innerText = "ئەنجامی کۆتایی ڕاگەیەندرا";

            const mode = document.getElementById('gameMode').value;
            if (mode === 'ai' || mode === 'online') {
                let iAmPlayer = amIPlayer1 ? 1 : 2;
                if (mode === 'ai') iAmPlayer = 1; 
                if (losingPlayer === iAmPlayer) setTimeout(() => alert("بەداخەوە دووبارە هەوڵدەوە هیچ نیە خەمێ مەخۆ حاجی"), 300);
                else setTimeout(() => alert("پیرۆزە یاریەکەت بردەوە"), 300);
            } else {
                let winner = losingPlayer === 1 ? "سەرەوە" : "خوارەوە";
                setTimeout(() => alert(`پیرۆزە یاریزانی ${winner} یاریەکەی بردەوە!`), 300);
            }
        }

        function checkGameOver() {
            let hasMoves = false;
            let mandatories = getAllMandatoryCaptures(currentPlayer, board);
            if (mandatories.length > 0) hasMoves = true;
            else {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const val = board[r][c];
                        if ((currentPlayer === 1 && (val === P1 || val === P1_KING)) || (currentPlayer === 2 && (val === P2 || val === P2_KING))) {
                            if (getNormalMovesForPiece(r, c, board).length > 0) hasMoves = true;
                        }
                    }
                }
            }
            if (!hasMoves) { declareWinner(currentPlayer); return true; }
            return false;
        }

        function executeMove(toR, toC, fromR, fromC, broadcast = false) {
            const move = validMoves.find(m => m.r === toR && m.c === toC);
            if (!move) return;
            if (broadcast && isOnline && conn) conn.send({ type: 'move', r: toR, c: toC, selectedR: fromR, selectedC: fromC });

            board[toR][toC] = board[fromR][fromC]; board[fromR][fromC] = EMPTY;
            
            let wasCapture = false;
            if (move.capture) { board[move.capture.r][move.capture.c] = EMPTY; playSound('capture'); wasCapture = true; } 
            else { playSound('move'); }

            let promoted = false;
            if (currentPlayer === 1 && toR === 0 && board[toR][toC] === P1) { board[toR][toC] = P1_KING; promoted = true; }
            if (currentPlayer === 2 && toR === 7 && board[toR][toC] === P2) { board[toR][toC] = P2_KING; promoted = true; }

            if (wasCapture && !promoted) {
                let furtherCaps = getCaptureMovesForPiece(toR, toC, board);
                if (furtherCaps.length > 0) {
                    isMultiCapturing = true; selectedPiece = { r: toR, c: toC, val: board[toR][toC] };
                    calculateValidMoves(); // ئەپدەیت بە یاسای Max Capture
                    drawBoard(); startTimer(); 
                    if (document.getElementById('gameMode').value === 'ai' && currentPlayer === 2 && isPlaying) setTimeout(makeAIMove, 700); 
                    return; 
                }
            }

            isMultiCapturing = false; selectedPiece = null; validMoves = [];
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateStatus(); drawBoard();
            
            if (checkGameOver()) return; 
            startTimer();
            if (document.getElementById('gameMode').value === 'ai' && currentPlayer === 2 && isPlaying) setTimeout(makeAIMove, 700);
        }

        function startTimer() {
            clearInterval(timerInterval);
            if (!isPlaying) return; 
            timeLeft = 30;
            const tDisplay = document.getElementById('timeDisplay'), tBox = document.getElementById('timerBox');
            tDisplay.innerText = timeLeft; tBox.style.background = "#ef4444"; 

            timerInterval = setInterval(() => {
                if (!isPlaying) { clearInterval(timerInterval); return; }
                timeLeft--; tDisplay.innerText = timeLeft;
                if (timeLeft <= 5) tBox.style.background = "#991b1b"; 
                if (timeLeft <= 0) { clearInterval(timerInterval); declareWinner(currentPlayer); }
            }, 1000);
        }

        // =========================================================
        // زیرەکی دەستکرد - ئاستی ١٠٠ی بێ حەد قووڵ و بەقووەت
        // =========================================================
        function makeAIMove() {
            if (!isPlaying) return;
            if (isMultiCapturing && selectedPiece) {
                let chosen = validMoves[Math.floor(Math.random() * validMoves.length)];
                executeMove(chosen.r, chosen.c, selectedPiece.r, selectedPiece.c, true);
                return;
            }

            let possibleMoves = [];
            let mandatories = getAllMandatoryCaptures(2, board);
            
            if (mandatories.length > 0) {
                mandatories.forEach(p => {
                    let caps = getCaptureMovesForPiece(p.r, p.c, board);
                    caps.forEach(m => possibleMoves.push({ from: {r: p.r, c: p.c}, to: m }));
                });
            } else {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] === P2 || board[r][c] === P2_KING) {
                            let norms = getNormalMovesForPiece(r, c, board);
                            norms.forEach(m => possibleMoves.push({ from: {r, c}, to: m }));
                        }
                    }
                }
            }

            if (possibleMoves.length > 0) {
                let level = parseInt(document.getElementById('aiLevel').value);
                let chosenMove = possibleMoves[0];

                if (level >= 90) {
                    // بیرکردنەوەی قووڵ: سەیری داهاتوو دەکات بۆ ئەوەی نەیخۆیت و خۆی بکات بە سوار
                    let bestScore = -Infinity;
                    for (let move of possibleMoves) {
                        let simBoard = board.map(row => [...row]);
                        simBoard[move.to.r][move.to.c] = simBoard[move.from.r][move.from.c];
                        simBoard[move.from.r][move.from.c] = EMPTY;
                        let score = 0;
                        if (move.to.capture) { simBoard[move.to.capture.r][move.to.capture.c] = EMPTY; score += 20; }
                        if (simBoard[move.to.r][move.to.c] === P2 && move.to.r === 7) { simBoard[move.to.r][move.to.c] = P2_KING; score += 50; }
                        
                        // ئایا ئەم جووڵەیە دەبێتە هۆی ئەوەی تۆ بیخۆیت؟
                        let danger = false;
                        for (let r=0; r<ROWS; r++) {
                            for (let c=0; c<COLS; c++) {
                                if (simBoard[r][c] === P1 || simBoard[r][c] === P1_KING) {
                                    if (getCaptureMovesForPiece(r, c, simBoard).length > 0) danger = true;
                                }
                            }
                        }
                        if (danger) score -= 40; // ڕادەکات لە مەترسی
                        else score += 5; // جووڵەی سەلامەت هەڵدەبژێرێت
                        
                        score += Math.random(); // بۆ ئەوەی هەرجارەو شێوازێک یاری بکات
                        if (score > bestScore) { bestScore = score; chosenMove = move; }
                    }
                } else {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                }

                selectedPiece = { r: chosenMove.from.r, c: chosenMove.from.c, val: board[chosenMove.from.r][chosenMove.from.c] };
                calculateValidMoves();
                executeMove(chosenMove.to.r, chosenMove.to.c, chosenMove.from.r, chosenMove.from.c, true);
            }
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = currentPlayer === 1 ? "نۆرەی یاریزانی خوارەوەیە" : "نۆرەی یاریزانی سەرەوەیە";
            statusDiv.style.color = currentPlayer === 1 ? document.getElementById('color1').value : document.getElementById('color2').value;
        }

        function resetGame(broadcast = false) {
            if (broadcast && isOnline && conn) { conn.send({ type: 'reset' }); }
            isPlaying = false; clearInterval(timerInterval);
            document.getElementById('timerBox').style.background = "#9ca3af";
            document.getElementById('timeDisplay').innerText = "وەستاوە";
            
            const btn = document.getElementById('togglePlayBtn');
            btn.innerText = "دەستپێکردنی یاری ▶️"; btn.className = "btn btn-green";
            document.getElementById('status').innerText = "چاوەڕێی دەستپێکردن..."; document.getElementById('status').style.color = "#1f2937";
            
            currentPlayer = 1; selectedPiece = null; validMoves = []; isMultiCapturing = false;
            initBoard(); drawBoard();
        }

        initBoard(); drawBoard();
    </script>
</body>
</html>
