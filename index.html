<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ئەپی کوردستان - دامە (مستەوای 1000)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            /* ڕەنگەکانی بۆردەکە گەڕێندرانەوە بۆ شێوە دارێکی جوان و ڕوون */
            --board-dark: #7a4b27; 
            --board-light: #dcb38a; 
            
            --player1-color: #1a1a1a; 
            --player2-color: #f1f1f1;
            --highlight: rgba(34, 197, 94, 0.7); 
            --danger: rgba(239, 68, 68, 0.7);
        }
        body {
            font-family: 'Tahoma', sans-serif; 
            /* باکگراوندی دەرەوە کرا بە سەوزێکی تاریکی نەرم کە چاو نائێشێنێت و تەرکیز تێک نادات */
            background: #15261b radial-gradient(circle at center, #223f2d 0%, #0a130d 100%);
            color: #f1f5f9;
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation; min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 5px; transition: all 0.3s; }
        
        /* بەشی کۆنتڕۆڵەکان */
        .controls-container {
            background: rgba(20, 30, 25, 0.85); padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); width: 100%;
            max-width: 450px; margin-bottom: 10px; box-sizing: border-box;
            transition: all 0.4s ease-out; overflow: hidden; max-height: 1000px; 
            border: 1px solid #2d4a3e;
        }
        .controls-container.hidden {
            max-height: 0; padding: 0; margin: 0; opacity: 0; border: none;
        }

        .control-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: #e2e8f0; font-weight: bold;}
        select, input[type="color"], input[type="range"], input[type="text"] {
            padding: 5px; border-radius: 5px; border: 1px solid #475569; font-family: inherit;
            background: #1e293b; color: white;
        }
        .online-box {
            background: rgba(15, 30, 25, 0.8); padding: 10px; border-radius: 8px; border: 1px solid #1f3d2f;
            display: none; flex-direction: column; gap: 10px; margin-top: 10px;
        }
        
        /* شاشەی یارییەکە */
        .game-header {
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; max-width: 450px; margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 10px; box-sizing: border-box;
            border: 1px solid #334155;
        }
        .timer-box {
            background: #ef4444; color: white; padding: 8px 15px; border-radius: 20px;
            font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            display: flex; align-items: center; gap: 5px; transition: background 0.3s;
        }
        .status { font-size: 1.2rem; font-weight: bold; text-align: center; flex-grow: 1; color: white; text-shadow: 1px 1px 2px black;}
        .alert-box { color: #ff6b6b; font-weight: bold; height: 24px; margin-bottom: 5px; font-size: 1.1rem; text-align: center; text-shadow: 1px 1px 2px black;}
        
        .board-container {
            width: 100%; max-width: 450px; position: relative; margin-bottom: auto;
        }
        .board {
            display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1/1;
            border: 10px solid #382110; border-radius: 6px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            transition: transform 0.6s ease;
        }
        .board.flipped { transform: rotate(180deg); }
        .board.flipped .piece { transform: rotate(180deg); }
        .board.flipped .piece.selected { transform: rotate(180deg) scale(1.15); }

        .cell { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .cell.dark { background-color: var(--board-dark); }
        .cell.light { background-color: var(--board-light); }
        .cell.highlight { background-color: var(--highlight); cursor: pointer; border: 3px solid #16a34a; box-sizing: border-box; }
        .cell.highlight-danger { background-color: var(--danger); cursor: pointer; border: 3px solid #ff4444; box-sizing: border-box; }
        
        .piece {
            width: 80%; height: 80%; border-radius: 50%;
            box-shadow: inset 0 -5px 8px rgba(0,0,0,0.7), 0 4px 6px rgba(0,0,0,0.8);
            transition: all 0.2s ease; cursor: pointer;
            display: flex; justify-content: center; align-items: center; border: 2px solid rgba(0,0,0,0.5);
            position: relative;
        }
        .piece.p1 { background-color: var(--player1-color); }
        .piece.p2 { background-color: var(--player2-color); }
        .piece.selected { transform: scale(1.15); box-shadow: 0 0 20px yellow; border: 2px solid yellow; z-index: 10; }
        
        /* دیزاینی کینگ بە ئاڵای کوردستان */
        .piece.king {
            border: 3px solid #FFD700 !important; 
            box-shadow: 0 0 15px #FFD700, inset 0 -4px 6px rgba(0,0,0,0.7) !important; 
        }
        .piece.king::after { 
            content: '☀️'; 
            font-size: 14px;
            position: absolute;
            background: linear-gradient(to bottom, #ED2024 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #278E43 66.6%); 
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #FFD700;
            color: #FEBD11;
            text-shadow: 0px 0px 2px rgba(0,0,0,0.8);
        }
        
        /* بەشی دوگمەکانی خوارەوە - دوورخراونەتەوە بۆ خوارەوە */
        .bottom-actions {
            width: 100%; max-width: 450px; 
            display: flex; flex-direction: row; 
            justify-content: space-between; gap: 10px; 
            margin-top: 50px; 
            margin-bottom: 20px;
        }
        .btn {
            color: white; border: none; padding: 12px 10px; border-radius: 10px; font-size: 1.1rem; 
            cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.4); transition: all 0.2s;
        }
        .btn-blue { background-color: #2563eb; font-size: 1rem;} 
        .btn-blue:active { background-color: #1d4ed8; }
        .btn-green { background-color: #16a34a; font-size: 1rem;} 
        .btn-orange { background-color: #d97706; font-size: 1rem;}
    </style>
</head>
<body>

    <div class="header" id="mainHeader">
        <h2 style="margin: 5px 0; font-size: 2.2rem; font-weight: 900; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 15px; display: inline-block;">
            <span style="color: white; text-shadow: 1px 1px 2px #000;">دامەی </span>
            <span style="color: #ED2024; text-shadow: 1px 1px 1px #000;">ک</span><span style="color: #ED2024; text-shadow: 1px 1px 1px #000;">و</span><span style="color: #FEBD11; text-shadow: 1px 1px 1px #000;">ر</span><span style="color: #FEBD11; text-shadow: 1px 1px 1px #000;">د</span><span style="color: #FFFFFF; text-shadow: 1px 1px 2px #000;">س</span><span style="color: #FFFFFF; text-shadow: 1px 1px 2px #000;">ت</span><span style="color: #278E43; text-shadow: 1px 1px 1px #000;">ا</span><span style="color: #278E43; text-shadow: 1px 1px 1px #000;">ن</span>
        </h2>
    </div>

    <!-- بەشی هەڵبژاردنەکان -->
    <div class="controls-container" id="controlsPanel">
        <div class="control-group">
            <label>شێوازی یاری:</label>
            <select id="gameMode" onchange="changeMode()">
                <option value="pvp">دوو یاریزان (لەسەر یەک شاشە)</option>
                <option value="ai">کۆمپیوتەر (AI)</option>
                <option value="online">ئۆنلاین لەگەڵ هاوڕێ 🌐</option>
            </select>
        </div>
        
        <div class="control-group" id="aiLevelContainer" style="display: none;">
            <label>ئاستی کۆمپیوتەر (بێ کۆتا قورس - 1000):</label>
            <input type="range" id="aiLevel" min="0" max="1000" value="1000">
        </div>

        <div class="online-box" id="onlineContainer">
            <div style="font-size: 0.9rem; color: #94a3b8; font-weight: bold;">کۆدەکەی خۆت بدە بە هاوڕێکەت، یان هی ئەو بنووسە.</div>
            <div style="display: flex; justify-content: space-between;">
                <span>کۆدی تۆ:</span>
                <strong id="myCode" style="font-size: 1.2rem; color: #f87171; letter-spacing: 2px;">دروستکردن...</strong>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="friendCode" placeholder="کۆدی هاوڕێکەت..." style="width: 60%; text-align: center; font-weight: bold; font-size: 1.1rem; background: #334155;">
                <button class="btn btn-green" style="width: 40%; padding: 5px;" onclick="connectToFriend()">بەستنەوە</button>
            </div>
            <div id="onlineStatus" style="text-align: center; font-weight: bold; color: #34d399;">چاوەڕوانی بەستنەوە...</div>
        </div>

        <div class="control-group" style="margin-top: 15px;">
            <label>بەردی ١ (خوارەوە):</label>
            <input type="color" id="color1" value="#1a1a1a" onchange="updateColors()">
            <label>بەردی ٢ (سەرەوە):</label>
            <input type="color" id="color2" value="#f1f1f1" onchange="updateColors()">
        </div>
    </div>

    <!-- شاشەی کاتی یاریکردن -->
    <div id="alertBox" class="alert-box"></div>
    
    <div class="game-header">
        <div class="timer-box" id="timerBox">⏱️ <span id="timeDisplay">--</span></div>
        <div id="status" class="status">چاوەڕێی دەستپێکردن...</div>
    </div>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <!-- دوگمەکانی خوارەوە -->
    <div class="bottom-actions">
        <button id="togglePlayBtn" class="btn btn-green" onclick="togglePlay()">دەستپێکردن ▶️</button>
        <button class="btn btn-blue" onclick="resetGame(true)">ڕیفرێش 🔄</button>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'move') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'capture') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });

        const ROWS = 8, COLS = 8;
        let board = [];
        let currentPlayer = 1; 
        
        let currentValidMoves = []; 
        let mustMovePiece = null; 
        let selectedPiece = null;
        let isPlaying = false; 
        let validMovesForUI = []; 
        const EMPTY = 0, P1 = 1, P2 = 2, P1_KING = 3, P2_KING = 4;

        let timerInterval;
        let timeLeft = 30;
        let peer = null, conn = null, myId = "", isOnline = false, amIPlayer1 = true;

        function showAlert(msg) {
            const box = document.getElementById('alertBox'); box.innerText = msg;
            setTimeout(() => box.innerText = "", 3500);
        }

        function updateColors() {
            document.documentElement.style.setProperty('--player1-color', document.getElementById('color1').value);
            document.documentElement.style.setProperty('--player2-color', document.getElementById('color2').value);
            if(isPlaying) updateStatus();
        }

        function toggleUIElements(hide) {
            const panel = document.getElementById('controlsPanel');
            const header = document.getElementById('mainHeader');
            if (hide) {
                panel.classList.add('hidden');
                header.style.fontSize = "1.5rem"; 
            } else {
                panel.classList.remove('hidden');
                header.style.fontSize = "2.2rem";
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('togglePlayBtn');
            if (isPlaying) {
                btn.innerText = "وەستاندن ⏸️"; btn.className = "btn btn-orange";
                toggleUIElements(true); 
                prepareTurn();
                updateStatus(); startTimer();
                const mode = document.getElementById('gameMode').value;
                if (mode === 'ai' && currentPlayer === 2) setTimeout(makeAIMove, 400);
            } else {
                btn.innerText = "دەستپێکردنەوە ▶️"; btn.className = "btn btn-green";
                toggleUIElements(false); 
                clearInterval(timerInterval);
                document.getElementById('timerBox').style.background = "#475569";
                document.getElementById('status').innerText = "یاری وەستاوە...";
            }
        }

        function changeMode() {
            const mode = document.getElementById('gameMode').value;
            document.getElementById('aiLevelContainer').style.display = (mode === 'ai') ? 'flex' : 'none';
            document.getElementById('onlineContainer').style.display = (mode === 'online') ? 'flex' : 'none';
            if (mode === 'online' && !peer) setupOnline();
            else if (mode !== 'online') { isOnline = false; if(conn) conn.close(); }
            resetGame(true);
        }

        function updatePerspective() {
            const boardDiv = document.getElementById('board');
            const mode = document.getElementById('gameMode').value;
            if (mode === 'online' && !amIPlayer1) {
                boardDiv.classList.add('flipped');
            } else {
                boardDiv.classList.remove('flipped');
            }
        }

        function setupOnline() {
            myId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(myId);
            peer.on('open', function(id) { document.getElementById('myCode').innerText = id; });
            peer.on('connection', function(connection) {
                conn = connection; amIPlayer1 = true;
                document.getElementById('onlineStatus').innerText = "✅ هاوڕێکەت هاتە ژوورەوە!"; resetGame(false);
                setupConnection();
            });
        }
        function connectToFriend() {
            const friendId = document.getElementById('friendCode').value.trim();
            if(!friendId || friendId === myId) return alert("کۆدێکی ڕاست بنووسە!");
            document.getElementById('onlineStatus').innerText = "بەستنەوە...";
            conn = peer.connect(friendId);
            conn.on('open', function() {
                amIPlayer1 = false;
                document.getElementById('onlineStatus').innerText = "✅ بەستراینەوە! یاری دەستی پێکرد."; resetGame(false);
                setupConnection();
            });
        }
        function setupConnection() {
            isOnline = true;
            conn.on('data', function(data) {
                if(data.type === 'move') {
                    if(!isPlaying) { 
                        isPlaying = true; 
                        document.getElementById('togglePlayBtn').innerText = "وەستاندن ⏸️"; 
                        document.getElementById('togglePlayBtn').className = "btn btn-orange"; 
                        toggleUIElements(true);
                    }
                    selectedPiece = { r: data.fromR, c: data.fromC };
                    executeMove(data.toR, data.toC, data.fromR, data.fromC, false);
                } else if(data.type === 'reset') { resetGame(false); }
            });
        }

        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(EMPTY));
            for (let c = 0; c < COLS; c++) { board[1][c] = P2; board[2][c] = P2; }
            for (let c = 0; c < COLS; c++) { board[5][c] = P1; board[6][c] = P1; }
        }

        function drawBoard() {
            const boardDiv = document.getElementById('board'); boardDiv.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    let isTarget = validMovesForUI.find(m => m.r === r && m.c === c);
                    if (isTarget) {
                        cell.classList.add(isTarget.capture ? 'highlight-danger' : 'highlight');
                        cell.onclick = () => onCellClick(r, c, true);
                    } else {
                        cell.onclick = () => onCellClick(r, c, false);
                    }

                    const val = board[r][c];
                    if (val !== EMPTY) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${val === P1 || val === P1_KING ? 'p1' : 'p2'}`;
                        if (val === P1_KING || val === P2_KING) piece.classList.add('king');
                        if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) piece.classList.add('selected');
                        cell.appendChild(piece);
                    }
                    boardDiv.appendChild(cell);
                }
            }
        }

        function isValid(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
        function isEnemy(enemyVal, playerNum) {
            if (playerNum === 1) return enemyVal === P2 || enemyVal === P2_KING;
            return enemyVal === P1 || enemyVal === P1_KING;
        }

        function getDirectCaptures(r, c, bState, pieceVal) {
            let caps = [];
            const isKing = (pieceVal === P1_KING || pieceVal === P2_KING);
            const player = (pieceVal === P1 || pieceVal === P1_KING) ? 1 : 2;

            if (isKing) {
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1], foundEnemy = false, enemyPos = null;
                    while (isValid(nr, nc)) {
                        let cellVal = bState[nr][nc];
                        if (cellVal !== EMPTY) {
                            if (!foundEnemy && isEnemy(cellVal, player)) { foundEnemy = true; enemyPos = {r: nr, c: nc}; } 
                            else { break; } 
                        } else if (foundEnemy) {
                            caps.push({ r: nr, c: nc, capture: enemyPos });
                        }
                        nr += d[0]; nc += d[1];
                    }
                });
            } else {
                const dir = (pieceVal === P1) ? -1 : 1;
                const directions = [[dir, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1], jumpR = r + (d[0]*2), jumpC = c + (d[1]*2);
                    if (isValid(jumpR, jumpC) && bState[jumpR][jumpC] === EMPTY && isValid(nr, nc)) {
                        let cellVal = bState[nr][nc];
                        if (cellVal !== EMPTY && isEnemy(cellVal, player)) {
                            caps.push({ r: jumpR, c: jumpC, capture: {r: nr, c: nc} });
                        }
                    }
                });
            }
            return caps;
        }

        function getNormalMoves(r, c, bState, pieceVal) {
            let moves = [];
            const isKing = (pieceVal === P1_KING || pieceVal === P2_KING);
            if (isKing) {
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1];
                    while (isValid(nr, nc) && bState[nr][nc] === EMPTY) { moves.push({ r: nr, c: nc, capture: null }); nr += d[0]; nc += d[1]; }
                });
            } else {
                const dir = (pieceVal === P1) ? -1 : 1;
                const directions = [[dir, 0], [0, -1], [0, 1]];
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1];
                    if (isValid(nr, nc) && bState[nr][nc] === EMPTY) moves.push({ r: nr, c: nc, capture: null });
                });
            }
            return moves;
        }

        function getMaxCapturePaths(player, bState, startR = -1, startC = -1, specificPieceVal = EMPTY) {
            let maxCaptures = 0;
            let bestPaths = [];

            function traverse(r, c, currentBoard, currentPath, pVal) {
                let caps = getDirectCaptures(r, c, currentBoard, pVal);
                if (caps.length === 0) {
                    if (currentPath.length > maxCaptures) {
                        maxCaptures = currentPath.length;
                        bestPaths = [currentPath];
                    } else if (currentPath.length === maxCaptures && maxCaptures > 0) {
                        bestPaths.push(currentPath);
                    }
                    return;
                }

                for (let cap of caps) {
                    let nextBoard = currentBoard.map(row => [...row]);
                    nextBoard[cap.r][cap.c] = pVal;
                    nextBoard[r][c] = EMPTY;
                    nextBoard[cap.capture.r][cap.capture.c] = EMPTY; 

                    let nextPieceVal = pVal;
                    if (pVal === P1 && cap.r === 0) nextPieceVal = P1_KING;
                    if (pVal === P2 && cap.r === 7) nextPieceVal = P2_KING;
                    nextBoard[cap.r][cap.c] = nextPieceVal;

                    let moveRecord = { from: {r, c}, to: cap };
                    traverse(cap.r, cap.c, nextBoard, [...currentPath, moveRecord], nextPieceVal);
                }
            }

            if (startR !== -1 && startC !== -1) {
                traverse(startR, startC, bState, [], specificPieceVal);
            } else {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        let val = bState[r][c];
                        if ((player === 1 && (val === P1 || val === P1_KING)) || (player === 2 && (val === P2 || val === P2_KING))) {
                            traverse(r, c, bState, [], val);
                        }
                    }
                }
            }
            return { maxCaptures, bestPaths };
        }

        function prepareTurn() {
            if (!isPlaying) return;
            let capData;
            if (mustMovePiece) {
                capData = getMaxCapturePaths(currentPlayer, board, mustMovePiece.r, mustMovePiece.c, board[mustMovePiece.r][mustMovePiece.c]);
            } else {
                capData = getMaxCapturePaths(currentPlayer, board);
            }

            currentValidMoves = [];
            if (capData.maxCaptures > 0) {
                for (let path of capData.bestPaths) {
                    currentValidMoves.push(path[0]);
                }
            } else {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        let val = board[r][c];
                        if ((currentPlayer === 1 && (val === P1 || val === P1_KING)) || (currentPlayer === 2 && (val === P2 || val === P2_KING))) {
                            let norms = getNormalMoves(r, c, board, val);
                            norms.forEach(m => currentValidMoves.push({ from: {r, c}, to: m }));
                        }
                    }
                }
            }

            currentValidMoves = currentValidMoves.filter((v,i,a) => a.findIndex(t => t.from.r === v.from.r && t.from.c === v.from.c && t.to.r === v.to.r && t.to.c === v.to.c) === i);

            if (currentValidMoves.length === 0) {
                declareWinner(currentPlayer);
            }
        }

        function onCellClick(r, c, isHighlight) {
            if (!isPlaying) return showAlert("تکایە سەرەتا کلیک لە 'دەستپێکردن' بکە!");
            const mode = document.getElementById('gameMode').value;
            if (mode === 'ai' && currentPlayer === 2) return;
            if (isOnline) { if (amIPlayer1 && currentPlayer === 2) return; if (!amIPlayer1 && currentPlayer === 1) return; }
            
            if (isHighlight && selectedPiece) {
                executeMove(r, c, selectedPiece.r, selectedPiece.c, true);
            } else {
                selectPiece(r, c);
            }
        }

        function selectPiece(r, c) {
            if (mustMovePiece && (r !== mustMovePiece.r || c !== mustMovePiece.c)) {
                showAlert("دەبێت بەردەوام بیت لە زنجیرە خواردن!"); return;
            }

            let myValid = currentValidMoves.filter(m => m.from.r === r && m.from.c === c);
            
            if (myValid.length === 0) {
                if (currentValidMoves.length > 0 && currentValidMoves[0].to.capture) {
                    showAlert("یاسا: دەبێت ئەو بەردە بجووڵێنیت کە زۆرترین خواردنی هەیە!");
                }
                return;
            }

            selectedPiece = { r, c };
            validMovesForUI = myValid.map(m => m.to);
            drawBoard();
        }

        function declareWinner(losingPlayer) {
            isPlaying = false; clearInterval(timerInterval);
            document.getElementById('togglePlayBtn').innerText = "یاری تەواو بوو 🏁";
            document.getElementById('togglePlayBtn').className = "btn btn-blue";
            document.getElementById('timerBox').style.background = "#475569";
            document.getElementById('timeDisplay').innerText = "کۆتایی";
            toggleUIElements(false); 

            const mode = document.getElementById('gameMode').value;
            if (mode === 'ai' || mode === 'online') {
                let iAmPlayer = amIPlayer1 ? 1 : 2;
                if (mode === 'ai') iAmPlayer = 1; 
                
                if (losingPlayer === iAmPlayer) {
                    setTimeout(() => alert("بەداخەوە، دووبارە هەوڵدە"), 300);
                } else {
                    setTimeout(() => alert("پیرۆزە"), 300);
                }
            } else {
                let winner = losingPlayer === 1 ? "سەرەوە" : "خوارەوە";
                setTimeout(() => alert(`پیرۆزە یاریزانی ${winner} یاریەکەی بردەوە!`), 300);
            }
        }

        function executeMove(toR, toC, fromR, fromC, broadcast = false) {
            if (broadcast && isOnline && conn) conn.send({ type: 'move', toR, toC, fromR, fromC });

            let move = currentValidMoves.find(m => m.from.r === fromR && m.from.c === fromC && m.to.r === toR && m.to.c === toC);
            if (!move) return; 

            board[toR][toC] = board[fromR][fromC]; board[fromR][fromC] = EMPTY;
            
            let wasCapture = false;
            if (move.to.capture) { board[move.to.capture.r][move.to.capture.c] = EMPTY; playSound('capture'); wasCapture = true; } 
            else { playSound('move'); }

            let promoted = false;
            if (currentPlayer === 1 && toR === 0 && board[toR][toC] === P1) { board[toR][toC] = P1_KING; promoted = true; }
            if (currentPlayer === 2 && toR === 7 && board[toR][toC] === P2) { board[toR][toC] = P2_KING; promoted = true; }

            if (wasCapture && !promoted) {
                let nextCapData = getMaxCapturePaths(currentPlayer, board, toR, toC, board[toR][toC]);
                if (nextCapData.maxCaptures > 0) {
                    mustMovePiece = {r: toR, c: toC};
                    selectedPiece = mustMovePiece;
                    prepareTurn();
                    validMovesForUI = currentValidMoves.map(m => m.to);
                    drawBoard(); startTimer(); 
                    if (document.getElementById('gameMode').value === 'ai' && currentPlayer === 2 && isPlaying) setTimeout(makeAIMove, 700); 
                    return; 
                }
            }

            mustMovePiece = null; selectedPiece = null; validMovesForUI = [];
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            prepareTurn(); 
            updateStatus(); drawBoard();
            
            startTimer();
            if (document.getElementById('gameMode').value === 'ai' && currentPlayer === 2 && isPlaying) setTimeout(makeAIMove, 700);
        }

        function startTimer() {
            clearInterval(timerInterval);
            if (!isPlaying) return; 
            timeLeft = 30;
            const tDisplay = document.getElementById('timeDisplay'), tBox = document.getElementById('timerBox');
            tDisplay.innerText = timeLeft; tBox.style.background = "#ef4444"; 

            timerInterval = setInterval(() => {
                if (!isPlaying) { clearInterval(timerInterval); return; }
                timeLeft--; tDisplay.innerText = timeLeft;
                if (timeLeft <= 5) tBox.style.background = "#991b1b"; 
                if (timeLeft <= 0) { clearInterval(timerInterval); declareWinner(currentPlayer); }
            }, 1000);
        }

        function evaluateBoard(b) {
            let score = 0;
            let p1Pieces = [], p2Pieces = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (b[r][c] === P2) { score += 100 + (r * 3); p2Pieces.push({r, c, k: false}); }
                    else if (b[r][c] === P2_KING) { score += 500; p2Pieces.push({r, c, k: true}); }
                    else if (b[r][c] === P1) { score -= 100 + ((7 - r) * 3); p1Pieces.push({r, c, k: false}); }
                    else if (b[r][c] === P1_KING) { score -= 500; p1Pieces.push({r, c, k: true}); }
                }
            }
            if (p2Pieces.length > 0 && p1Pieces.length > 0) {
                let distScore = 0;
                for (let p2 of p2Pieces) {
                    if (p2.k) {
                        let minDist = 999;
                        for (let p1 of p1Pieces) {
                            let dist = Math.abs(p2.r - p1.r) + Math.abs(p2.c - p1.c);
                            if (dist < minDist) minDist = dist;
                        }
                        distScore -= minDist; 
                    }
                }
                score += distScore * 2;
            }
            return score;
        }

        function getSimulatedMoves(player, bState, mustMoveR = -1, mustMoveC = -1) {
            let capData;
            if (mustMoveR !== -1) capData = getMaxCapturePaths(player, bState, mustMoveR, mustMoveC, bState[mustMoveR][mustMoveC]);
            else capData = getMaxCapturePaths(player, bState);

            let moves = [];
            if (capData.maxCaptures > 0) {
                for (let path of capData.bestPaths) moves.push(path[0]);
            } else {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        let val = bState[r][c];
                        if ((player === 1 && (val === P1 || val === P1_KING)) || (player === 2 && (val === P2 || val === P2_KING))) {
                            let norms = getNormalMoves(r, c, bState, val);
                            norms.forEach(m => moves.push({ from: {r, c}, to: m }));
                        }
                    }
                }
            }
            return moves.filter((v,i,a) => a.findIndex(t => t.from.r === v.from.r && t.from.c === v.from.c && t.to.r === v.to.r && t.to.c === v.to.c) === i);
        }

        function minimax(bState, depth, alpha, beta, isMaximizing, mustMoveR = -1, mustMoveC = -1) {
            if (depth === 0) return evaluateBoard(bState);
            let player = isMaximizing ? 2 : 1;
            let possibleMoves = getSimulatedMoves(player, bState, mustMoveR, mustMoveC);

            if (possibleMoves.length === 0) {
                return isMaximizing ? -99999 : 99999;
            }

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of possibleMoves) {
                    let simBoard = bState.map(row => [...row]);
                    let fromR = move.from.r, fromC = move.from.c;
                    simBoard[move.to.r][move.to.c] = simBoard[fromR][fromC]; simBoard[fromR][fromC] = EMPTY;
                    
                    let wasCapture = false;
                    if (move.to.capture) { simBoard[move.to.capture.r][move.to.capture.c] = EMPTY; wasCapture = true; }
                    
                    let promoted = false;
                    if (move.to.r === 7 && simBoard[move.to.r][move.to.c] === P2) { simBoard[move.to.r][move.to.c] = P2_KING; promoted = true; }
                    
                    let nextMustR = -1, nextMustC = -1, nextIsMax = false;
                    if (wasCapture && !promoted && getMaxCapturePaths(2, simBoard, move.to.r, move.to.c, simBoard[move.to.r][move.to.c]).maxCaptures > 0) {
                        nextMustR = move.to.r; nextMustC = move.to.c; nextIsMax = true; 
                    }
                    
                    let ev = minimax(simBoard, nextIsMax ? depth : depth - 1, alpha, beta, nextIsMax, nextMustR, nextMustC);
                    maxEval = Math.max(maxEval, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of possibleMoves) {
                    let simBoard = bState.map(row => [...row]);
                    let fromR = move.from.r, fromC = move.from.c;
                    simBoard[move.to.r][move.to.c] = simBoard[fromR][fromC]; simBoard[fromR][fromC] = EMPTY;
                    
                    let wasCapture = false;
                    if (move.to.capture) { simBoard[move.to.capture.r][move.to.capture.c] = EMPTY; wasCapture = true; }
                    
                    let promoted = false;
                    if (move.to.r === 0 && simBoard[move.to.r][move.to.c] === P1) { simBoard[move.to.r][move.to.c] = P1_KING; promoted = true; }
                    
                    let nextMustR = -1, nextMustC = -1, nextIsMax = true;
                    if (wasCapture && !promoted && getMaxCapturePaths(1, simBoard, move.to.r, move.to.c, simBoard[move.to.r][move.to.c]).maxCaptures > 0) {
                        nextMustR = move.to.r; nextMustC = move.to.c; nextIsMax = false; 
                    }
                    
                    let ev = minimax(simBoard, nextIsMax ? depth - 1 : depth, alpha, beta, nextIsMax, nextMustR, nextMustC);
                    minEval = Math.min(minEval, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeAIMove() {
            if (!isPlaying || currentValidMoves.length === 0) return;

            let level = parseInt(document.getElementById('aiLevel').value);
            
            if (level >= 900) {
                let bestScore = -Infinity;
                let bestMoves = [];
                for (let move of currentValidMoves) {
                    let simBoard = board.map(row => [...row]);
                    simBoard[move.to.r][move.to.c] = simBoard[move.from.r][move.from.c];
                    simBoard[move.from.r][move.from.c] = EMPTY;
                    
                    let wasCapture = false;
                    if (move.to.capture) { simBoard[move.to.capture.r][move.to.capture.c] = EMPTY; wasCapture = true; }
                    
                    let promoted = false;
                    if (move.to.r === 7 && simBoard[move.to.r][move.to.c] === P2) { simBoard[move.to.r][move.to.c] = P2_KING; promoted = true; }
                    
                    let nextMustR = -1, nextMustC = -1, nextIsMax = false;
                    if (wasCapture && !promoted && getMaxCapturePaths(2, simBoard, move.to.r, move.to.c, simBoard[move.to.r][move.to.c]).maxCaptures > 0) {
                        nextMustR = move.to.r; nextMustC = move.to.c; nextIsMax = true;
                    }

                    let score = minimax(simBoard, nextIsMax ? 4 : 3, -Infinity, Infinity, nextIsMax, nextMustR, nextMustC);
                    
                    if (score > bestScore) { 
                        bestScore = score; 
                        bestMoves = [move]; 
                    } else if (score === bestScore) {
                        bestMoves.push(move);
                    }
                }
                
                let chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];
                executeMove(chosenMove.to.r, chosenMove.to.c, chosenMove.from.r, chosenMove.from.c, true);
            } else {
                let chosenMove = currentValidMoves[Math.floor(Math.random() * currentValidMoves.length)];
                executeMove(chosenMove.to.r, chosenMove.to.c, chosenMove.from.r, chosenMove.from.c, true);
            }
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            const mode = document.getElementById('gameMode').value;
            let colorHex = currentPlayer === 1 ? document.getElementById('color1').value : document.getElementById('color2').value;
            
            if (mode === 'online') {
                if ((currentPlayer === 1 && amIPlayer1) || (currentPlayer === 2 && !amIPlayer1)) {
                    statusDiv.innerText = "نۆرەی تۆیە";
                } else {
                    statusDiv.innerText = "نۆرەی هاوڕێکەتە...";
                }
            } else if (mode === 'ai') {
                statusDiv.innerText = currentPlayer === 1 ? "نۆرەی تۆیە" : "نۆرەی کۆمپیوتەرە...";
            } else {
                statusDiv.innerText = currentPlayer === 1 ? "نۆرەی خوارەوەیە" : "نۆرەی سەرەوەیە";
            }
            statusDiv.style.color = colorHex;
        }

        function resetGame(broadcast = false) {
            if (broadcast && isOnline && conn) { conn.send({ type: 'reset' }); }
            isPlaying = false; clearInterval(timerInterval);
            document.getElementById('timerBox').style.background = "#475569";
            document.getElementById('timeDisplay').innerText = "--";
            
            const btn = document.getElementById('togglePlayBtn');
            btn.innerText = "دەستپێکردن ▶️"; btn.className = "btn btn-green";
            document.getElementById('status').innerText = "چاوەڕێی دەستپێکردن..."; document.getElementById('status').style.color = "white";
            
            toggleUIElements(false); 
            
            currentPlayer = 1; mustMovePiece = null; selectedPiece = null; validMovesForUI = []; currentValidMoves = [];
            
            updatePerspective(); 
            initBoard(); drawBoard();
        }

        updatePerspective();
        initBoard(); drawBoard();
    </script>
</body>
