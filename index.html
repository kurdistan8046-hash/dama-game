<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دامەی تورکی پڕۆ</title>
    <!-- پەڕگەی PeerJS بۆ بەستنەوەی ئۆنلاین -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --board-dark: #8b4513;
            --board-light: #deb887;
            --player1-color: #111111;
            --player2-color: #f8f9fa;
            --highlight: rgba(34, 197, 94, 0.6);
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation; /* ڕێگری لە زووم بوون لەسەر تابلێت */
        }
        .header { text-align: center; margin-bottom: 5px; }
        .flag { width: 70px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .controls {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%;
            max-width: 450px; margin-bottom: 15px; box-sizing: border-box;
        }
        .control-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        select, input[type="color"], input[type="range"], input[type="text"] {
            padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;
        }
        .online-box {
            background: #e0f2fe; padding: 10px; border-radius: 8px; border: 1px solid #bae6fd;
            display: none; flex-direction: column; gap: 10px; margin-top: 10px;
        }
        .timer-box {
            background: #ef4444; color: white; padding: 10px 20px; border-radius: 30px;
            font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(239,68,68,0.3);
            display: flex; align-items: center; gap: 10px;
        }
        .board {
            display: grid; grid-template-columns: repeat(8, 1fr);
            width: 100%; max-width: 450px; aspect-ratio: 1/1;
            border: 4px solid #4a3728; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .cell { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .cell.dark { background-color: var(--board-dark); }
        .cell.light { background-color: var(--board-light); }
        .cell.highlight { background-color: var(--highlight); cursor: pointer; border: 2px solid #16a34a; box-sizing: border-box; }
        
        .piece {
            width: 80%; height: 80%; border-radius: 50%;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.4), 0 3px 5px rgba(0,0,0,0.5);
            transition: all 0.2s ease; cursor: pointer;
            display: flex; justify-content: center; align-items: center; border: 2px solid rgba(0,0,0,0.2);
        }
        .piece.p1 { background-color: var(--player1-color); }
        .piece.p2 { background-color: var(--player2-color); }
        .piece.selected { transform: scale(1.15); box-shadow: 0 0 15px yellow; border: 2px solid yellow; z-index: 10; }
        .piece.king::after { content: '👑'; font-size: 1.5rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        
        .status { margin: 10px 0; font-size: 1.2rem; font-weight: bold; }
        .btn {
            background-color: #2563eb; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold;
        }
        .btn:active { background-color: #1d4ed8; }
        .btn-green { background-color: #16a34a; }
    </style>
</head>
<body>

    <div class="header">
        <svg class="flag" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="300" height="66.6" fill="#ED2024"/>
            <rect y="66.6" width="300" height="66.6" fill="#FFFFFF"/>
            <rect y="133.2" width="300" height="66.8" fill="#278E43"/>
            <circle cx="150" cy="100" r="22" fill="#FEBD11"/>
        </svg>
        <h2 style="margin: 5px 0; color: #1f2937;">دامەی تورکی پڕۆ</h2>
    </div>

    <!-- کاتژمێری ستاندارد -->
    <div class="timer-box" id="timerBox">
        ⏱️ <span id="timeDisplay">30</span> چرکە
    </div>

    <div class="controls">
        <div class="control-group">
            <label>شێوازی یاری:</label>
            <select id="gameMode" onchange="changeMode()">
                <option value="pvp">دوو یاریزان (لەسەر یەک شاشە)</option>
                <option value="ai">کۆمپیوتەر (AI)</option>
                <option value="online">ئۆنلاین لەگەڵ هاوڕێ 🌐</option>
            </select>
        </div>
        
        <div class="control-group" id="aiLevelContainer" style="display: none;">
            <label>ئاستی کۆمپیوتەر (0-100):</label>
            <input type="range" id="aiLevel" min="0" max="100" value="50">
        </div>

        <div class="online-box" id="onlineContainer">
            <div style="font-size: 0.9rem; color: #0369a1; font-weight: bold;">کۆدەکەی خۆت بدە بە هاوڕێکەت، یان کۆدەکەی ئەو لێرە بنووسە بۆ بەستنەوە.</div>
            <div style="display: flex; justify-content: space-between;">
                <span>کۆدی تۆ:</span>
                <strong id="myCode" style="font-size: 1.2rem; color: #b91c1c; letter-spacing: 2px;">دروستکردن...</strong>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="friendCode" placeholder="کۆدی هاوڕێکەت..." style="width: 60%; text-align: center; font-weight: bold; font-size: 1.1rem;">
                <button class="btn btn-green" style="width: 40%; padding: 5px;" onclick="connectToFriend()">بەستنەوە</button>
            </div>
            <div id="onlineStatus" style="text-align: center; font-weight: bold; color: #047857;">چاوەڕوانی بەستنەوە...</div>
        </div>

        <div class="control-group" style="margin-top: 15px;">
            <label>بەردی ١ (خوارەوە):</label>
            <input type="color" id="color1" value="#111111" onchange="updateColors()">
            <label>بەردی ٢ (سەرەوە):</label>
            <input type="color" id="color2" value="#f8f9fa" onchange="updateColors()">
        </div>
        
        <button class="btn" onclick="resetGame(true)">دەستپێکردنەوەی یاری</button>
    </div>

    <div id="status" class="status">نۆرەی یاریزانی خوارەوەیە (ڕەش)</div>

    <div class="board" id="board"></div>

    <script>
        // === دەنگی شاز و پڕۆفیشناڵ (بێ عەیب) ===
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'move') {
                // دەنگی جووڵەی دار (تەقێکی کورت)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'capture') {
                // دەنگی خواردن (تەقێکی قورستر و گەورەتر)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // بۆ کارکردنی دەنگ لەسەر مۆبایل پێویستە بە کرتەیەک دەست پێبکات
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });

        // === لۆژیکی سەرەکی یارییەکە ===
        const ROWS = 8, COLS = 8;
        let board = [];
        let currentPlayer = 1; 
        let selectedPiece = null;
        let validMoves = [];
        const EMPTY = 0, P1 = 1, P2 = 2, P1_KING = 3, P2_KING = 4;

        // کاتژمێر
        let timerInterval;
        let timeLeft = 30;

        // ئۆنلاین (PeerJS)
        let peer = null;
        let conn = null;
        let myId = "";
        let isOnline = false;
        let amIPlayer1 = true;

        function updateColors() {
            document.documentElement.style.setProperty('--player1-color', document.getElementById('color1').value);
            document.documentElement.style.setProperty('--player2-color', document.getElementById('color2').value);
            updateStatus();
        }

        function changeMode() {
            const mode = document.getElementById('gameMode').value;
            document.getElementById('aiLevelContainer').style.display = (mode === 'ai') ? 'flex' : 'none';
            document.getElementById('onlineContainer').style.display = (mode === 'online') ? 'flex' : 'none';
            
            if (mode === 'online' && !peer) {
                setupOnline();
            } else if (mode !== 'online') {
                isOnline = false;
                if(conn) conn.close();
            }
            resetGame(true);
        }

        // === بەشی ئۆنلاین (PeerJS) ===
        function setupOnline() {
            myId = Math.floor(1000 + Math.random() * 9000).toString(); // کۆدی ٤ ژمارەیی
            peer = new Peer(myId);
            
            peer.on('open', function(id) {
                document.getElementById('myCode').innerText = id;
            });
            
            // کاتێک کەسێک دێتە ژوورەوە بۆ لای تۆ
            peer.on('connection', function(connection) {
                conn = connection;
                setupConnection();
                amIPlayer1 = true; // تۆ خاوەن ماڵیت، خوارەوەیت
                document.getElementById('onlineStatus').innerText = "✅ هاوڕێکەت هاتە ژوورەوە!";
                resetGame(false);
            });
        }

        function connectToFriend() {
            const friendId = document.getElementById('friendCode').value.trim();
            if(!friendId || friendId === myId) return alert("کۆدێکی ڕاست بنووسە!");
            
            document.getElementById('onlineStatus').innerText = "بەستنەوە...";
            conn = peer.connect(friendId);
            
            conn.on('open', function() {
                setupConnection();
                amIPlayer1 = false; // تۆ چوویته ژوورەوە، سەرەوەیت
                document.getElementById('onlineStatus').innerText = "✅ بەستراینەوە! یاری دەستی پێکرد.";
                resetGame(false);
            });
        }

        function setupConnection() {
            isOnline = true;
            conn.on('data', function(data) {
                if(data.type === 'move') {
                    executeMove(data.r, data.c, data.selectedR, data.selectedC, false);
                } else if(data.type === 'reset') {
                    resetGame(false);
                }
            });
        }

        // === دروستکردنی بۆرد و یاری ===
        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(EMPTY));
            for (let c = 0; c < COLS; c++) { board[1][c] = P2; board[2][c] = P2; }
            for (let c = 0; c < COLS; c++) { board[5][c] = P1; board[6][c] = P1; }
        }

        function drawBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    
                    if (validMoves.some(m => m.r === r && m.c === c)) {
                        cell.classList.add('highlight');
                        cell.onclick = () => onCellClick(r, c, true);
                    } else {
                        cell.onclick = () => onCellClick(r, c, false);
                    }

                    const val = board[r][c];
                    if (val !== EMPTY) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${val === P1 || val === P1_KING ? 'p1' : 'p2'}`;
                        if (val === P1_KING || val === P2_KING) piece.classList.add('king');
                        if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                            piece.classList.add('selected');
                        }
                        cell.appendChild(piece);
                    }
                    boardDiv.appendChild(cell);
                }
            }
        }

        function onCellClick(r, c, isHighlight) {
            const mode = document.getElementById('gameMode').value;
            
            // ڕێگری لە دەستکاری کاتی ئۆنلاین و AI
            if (mode === 'ai' && currentPlayer === 2) return;
            if (isOnline) {
                if (amIPlayer1 && currentPlayer === 2) return; // نۆرەی تۆ نییە
                if (!amIPlayer1 && currentPlayer === 1) return; // نۆرەی تۆ نییە
            }

            if (isHighlight) {
                const move = validMoves.find(m => m.r === r && m.c === c);
                executeMove(r, c, selectedPiece.r, selectedPiece.c, true);
            } else {
                selectPiece(r, c);
            }
        }

        function selectPiece(r, c) {
            const val = board[r][c];
            if (val === EMPTY) return;
            
            const isP1Piece = (val === P1 || val === P1_KING);
            if ((currentPlayer === 1 && isP1Piece) || (currentPlayer === 2 && !isP1Piece)) {
                selectedPiece = { r, c, val };
                calculateValidMoves();
                drawBoard();
            }
        }

        function calculateValidMoves() {
            validMoves = [];
            if (!selectedPiece) return;
            
            const r = selectedPiece.r;
            const c = selectedPiece.c;
            const isKing = (selectedPiece.val === P1_KING || selectedPiece.val === P2_KING);
            const dir = (currentPlayer === 1) ? -1 : 1; 

            const directions = [[dir, 0], [0, -1], [0, 1]]; // پێشەوە، ڕاست، چەپ
            if (isKing) directions.push([-dir, 0]); // پاشا بۆ دواوەش

            // 1. گەڕان بۆ خواردن (Capture) - لە دامە خواردن ئەولەویەتە
            let canCapture = false;
            directions.forEach(d => {
                let nr = r + d[0], nc = c + d[1];
                let jumpR = r + (d[0]*2), jumpC = c + (d[1]*2);
                if (isValid(jumpR, jumpC) && board[jumpR][jumpC] === EMPTY && isValid(nr, nc)) {
                    let enemy = board[nr][nc];
                    if (enemy !== EMPTY && isEnemy(enemy)) {
                        validMoves.push({ r: jumpR, c: jumpC, capture: {r: nr, c: nc} });
                        canCapture = true;
                    }
                }
            });

            // 2. ئەگەر نەتوانرا بخورێت، جووڵەی ئاسایی
            if (!canCapture) {
                directions.forEach(d => {
                    let nr = r + d[0], nc = c + d[1];
                    if (isValid(nr, nc) && board[nr][nc] === EMPTY) {
                        validMoves.push({ r: nr, c: nc, capture: null });
                    }
                });
            }
        }

        function isValid(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
        
        function isEnemy(val) {
            if (currentPlayer === 1) return val === P2 || val === P2_KING;
            return val === P1 || val === P1_KING;
        }

        // کردارەکە (هەم بۆ خۆت، هەم بۆ ئۆنلاین)
        function executeMove(toR, toC, fromR, fromC, broadcast = false) {
            // دیاریکردنەوەی بەردەکە بۆ ئەوەی دڵنیا بین
            selectedPiece = { r: fromR, c: fromC, val: board[fromR][fromC] };
            calculateValidMoves();
            
            const move = validMoves.find(m => m.r === toR && m.c === toC);
            if (!move) return;

            if (broadcast && isOnline && conn) {
                conn.send({ type: 'move', r: toR, c: toC, selectedR: fromR, selectedC: fromC });
            }

            board[toR][toC] = board[fromR][fromC];
            board[fromR][fromC] = EMPTY;
            
            if (move.capture) {
                board[move.capture.r][move.capture.c] = EMPTY;
                playSound('capture');
            } else {
                playSound('move');
            }

            if (currentPlayer === 1 && toR === 0 && board[toR][toC] === P1) board[toR][toC] = P1_KING;
            if (currentPlayer === 2 && toR === 7 && board[toR][toC] === P2) board[toR][toC] = P2_KING;

            selectedPiece = null;
            validMoves = [];
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            
            updateStatus();
            drawBoard();
            startTimer(); // کاتژمێر سفر بکەرەوە

            const mode = document.getElementById('gameMode').value;
            if (mode === 'ai' && currentPlayer === 2) {
                setTimeout(makeAIMove, 600);
            }
        }

        // === کاتژمێری ستاندارد ===
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const tDisplay = document.getElementById('timeDisplay');
            const tBox = document.getElementById('timerBox');
            tDisplay.innerText = timeLeft;
            tBox.style.background = "#ef4444"; // سوور

            timerInterval = setInterval(() => {
                timeLeft--;
                tDisplay.innerText = timeLeft;
                
                if (timeLeft <= 5) tBox.style.background = "#991b1b"; // سووری تۆخ کاتی تەواوبوون
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoPlayRandom();
                }
            }, 1000);
        }

        // ئەگەر کات تەواو بوو، خۆکارانە یاری دەکات
        function autoPlayRandom() {
            if (isOnline) {
                // تەنها مۆبایلەکەی خۆت بڕیار لەسەر بەردەکانی خۆت دەدات کاتێک کات تەواو دەبێت
                if (amIPlayer1 && currentPlayer === 2) return;
                if (!amIPlayer1 && currentPlayer === 1) return;
            }

            let allPossible = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = board[r][c];
                    if ((currentPlayer === 1 && (val === P1 || val === P1_KING)) || 
                        (currentPlayer === 2 && (val === P2 || val === P2_KING))) {
                        selectedPiece = { r, c, val };
                        calculateValidMoves();
                        validMoves.forEach(m => { allPossible.push({ from: {r, c}, to: m }); });
                    }
                }
            }
            selectedPiece = null;
            validMoves = [];

            if (allPossible.length > 0) {
                const captures = allPossible.filter(m => m.to.capture);
                let chosen = captures.length > 0 ? captures[Math.floor(Math.random() * captures.length)] : allPossible[Math.floor(Math.random() * allPossible.length)];
                executeMove(chosen.to.r, chosen.to.c, chosen.from.r, chosen.from.c, true);
            } else {
                alert(currentPlayer === 1 ? "یاریزانی خوارەوە دۆڕا!" : "یاریزانی سەرەوە دۆڕا!");
                clearInterval(timerInterval);
            }
        }

        // === زیرەکی دەستکرد AI ===
        function makeAIMove() {
            let allPossible = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = board[r][c];
                    if (val === P2 || val === P2_KING) {
                        selectedPiece = {r, c, val};
                        calculateValidMoves();
                        validMoves.forEach(m => { allPossible.push({ from: {r, c}, to: m }); });
                    }
                }
            }
            selectedPiece = null;
            validMoves = [];

            if (allPossible.length > 0) {
                const aiLevel = document.getElementById('aiLevel').value;
                const captures = allPossible.filter(m => m.to.capture);
                let chosen;
                
                if (captures.length > 0 && Math.random() * 100 <= aiLevel) {
                    chosen = captures[Math.floor(Math.random() * captures.length)];
                } else {
                    chosen = allPossible[Math.floor(Math.random() * allPossible.length)];
                }
                executeMove(chosen.to.r, chosen.to.c, chosen.from.r, chosen.from.c, false);
            }
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = currentPlayer === 1 ? "نۆرەی یاریزانی خوارەوەیە" : "نۆرەی یاریزانی سەرەوەیە";
            statusDiv.style.color = currentPlayer === 1 ? document.getElementById('color1').value : document.getElementById('color2').value;
        }

        function resetGame(broadcast = false) {
            if (broadcast && isOnline && conn) {
                conn.send({ type: 'reset' });
            }
            currentPlayer = 1;
            selectedPiece = null;
            validMoves = [];
            initBoard();
            updateColors();
            drawBoard();
            startTimer();
        }

        resetGame();

    </script>
</body>
</html>
